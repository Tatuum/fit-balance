# Garment technique -> visual effects it produces. A fact about the
# technique, independent of who wears it (NOTES.md "Core architecture").
# The first 7 techniques below are used by the 5 worked examples in
# NOTES.md; techniques added after that back the manual garment catalog
# (garments.yaml) — see NOTES.md's "Garment catalog" section.

sheath_bodycon:
  - clings_to_waist
  - clings_to_hip

belted_natural_waist:
  - defines_waist

drop_waist:
  - elongates_torso
  - shortens_leg

empire_waistline:
  - elongates_leg
  - shortens_torso

vertical_detail:
  - reduces_bulk

oversized_top:
  - adds_bulk
  - hides_waist

skinny_straight:
  - reduces_bulk

high_rise:
  - elongates_leg

low_rise:
  - elongates_torso
  - shortens_leg

wide_leg:
  - adds_volume_bottom

cropped_ankle_length:
  - shortens_leg

# Techniques below added by decision 0012 — a garment catalog realism pass.
# All reuse existing effect tags; none require new scoring.py rules.
structured_shoulder:
  - adds_volume_top

puff_sleeve:
  - adds_volume_top

peplum:
  - defines_waist
  - adds_volume_bottom

wrap_style:
  - defines_waist

v_neck:
  - elongates_torso

a_line:
  - adds_volume_bottom

pencil_skirt:
  - clings_to_hip

# Added by decision 0013 — the first technique scored directly against
# shoulder_hip_balance rather than the derived top_hip_balance.
scoop_neck:
  - narrows_shoulder
