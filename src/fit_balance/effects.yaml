# Garment technique -> visual effects it produces. A fact about the
# technique, independent of who wears it (NOTES.md "Core architecture").
# The first 7 techniques below are used by the 5 worked examples in
# NOTES.md; techniques added after that back the manual garment catalog
# (garments.yaml) — see NOTES.md's "Garment catalog" section.

sheath_bodycon:
  - clings_to_waist
  - clings_to_hip

belted_natural_waist:
  - defines_waist

drop_waist:
  - elongates_torso
  - shortens_leg

empire_waistline:
  - elongates_leg
  - shortens_torso

vertical_detail:
  - reduces_bulk

oversized_top:
  - adds_volume_top
  - adds_bulk
  - hides_waist

skinny_straight:
  - reduces_bulk

high_rise:
  - elongates_leg

low_rise:
  - elongates_torso
  - shortens_leg

wide_leg:
  - adds_volume_bottom

cropped_ankle_length:
  - shortens_leg
